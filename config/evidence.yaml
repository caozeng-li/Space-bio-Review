http_timeout_seconds: 60
browser_fallback: true
model_rerank: true


legacy_document:
  executable: soffice
  timeout_seconds: 90
  pdf_fallback: true

literature:
  max_actions: 12
  max_model_turns: 18
  context_soft_tokens: 64000
discovery:
  enabled: [europe_pmc, openalex, openalex_semantic, semantic_scholar, arxiv, crossref, tavily]
  intervals:
    europe_pmc: 0.2
    openalex: 0.1
    openalex_semantic: 1.0
    semantic_scholar: 1.0
    arxiv: 3.0
    crossref: 0.2
    tavily: 0.2
  cache_seconds: 300
  max_relation_seeds: 2
