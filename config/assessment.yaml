# Independent downstream configuration; does not change research task identities.
model:
  model: deepseek-v4-pro
  base_url: https://dashscope.aliyuncs.com/apps/anthropic
  request_protocol: messages
  structured_output: json_schema
  tools: false
  context_window: 1048576
  max_tokens: 24576
  timeout_seconds: 600
  retries: 0
  schema_supported: true
  schema_with_thinking: true
  capability_verified: true
  capability_source: https://www.alibabacloud.com/help/zh/model-studio/anthropic-api-messages
  open_weights_url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro
  reasoning_reserve: 4096
  extra_body: {thinking: {type: enabled}, output_config: {effort: high}}
context_tokens: 96000
assessment_tokens: 24576
author_tokens: 8192
summary_tokens: 8192
