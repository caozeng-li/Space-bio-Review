[project]
name = "spacebio-review"
version = "0.1.0"
description = "Research agents for scientific project review"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.60,<3",
    "pydantic>=2.10,<3",
    "markdown-it-py>=3,<5",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "trafilatura>=2.3.0",
    "rank-bm25>=0.2.2",
    "playwright>=1.63.0",
    "docling>=2.132.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

# Keep Windows installs on the CUDA build, including future uv sync/run.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "reportlab>=5.0.1",
    "ruff>=0.9,<1",
]

[project.scripts]
spacebio-review = "spacebio_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacebio_review"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/skills", "/config", "/tests", "/scripts", "/examples", "/README.md", "/pyproject.toml", "/uv.lock", "/.python-version"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
